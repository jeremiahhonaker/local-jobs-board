# Local Jobs Board — Render deploy config
#
# Deploy with: render blueprint (dashboard) or `render blueprint launch`
# after pushing this repo to GitHub. Then set the secret env vars marked
# `sync: false` in the Render dashboard (they are never committed here).
#
# The database is a SQLite file on a Render persistent disk (mounted at
# /data), so it survives deploys and restarts. No Turso account is needed:
# the Turso code path is still in the app and can be re-enabled later by
# setting TURSO_DATABASE_URL / TURSO_AUTH_TOKEN in the dashboard.
#
# Note: a service with a persistent disk can't scale past one instance,
# and deploys have a few seconds of downtime (Render stops the old
# instance before starting the new one).

services:
  - type: web
    name: local-jobs-board
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    disk:
      name: jobs-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      # Public URL of the deployed app. Update after adding your custom domain.
      - key: APP_URL
        value: https://local-jobs-board.onrender.com
      # Email of the board owner — only this account sees board-wide fee totals.
      - key: OWNER_EMAIL
        sync: false
      # SQLite file on the persistent disk (created automatically on startup).
      - key: LOCAL_DB_PATH
        value: /data/app.db
      # Resend (https://resend.com) sends the magic-link sign-in emails.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Local Jobs Board <noreply@localhost>
